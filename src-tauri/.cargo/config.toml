[build]
rustflags = ["--cfg=web_sys_unstable_apis"]

[env]
RUST_LIB_BACKTRACE = "1"
RUST_BACKTRACE = "1"
WASMTIME_BACKTRACE_DETAILS = "1"
# Xcode 27 / iOS 27 SDK rejects deployment targets below 15.0. Xcode injects an
# older IPHONEOS_DEPLOYMENT_TARGET (14.0) into the "Build Rust Code" script phase,
# which tauri-utils forwards to swift-rs when cross-compiling tauri's Swift
# package. Force a supported floor so the Swift build succeeds. (Ignored by
# non-iOS targets; iOS app/widget targets keep their own higher targets.)
IPHONEOS_DEPLOYMENT_TARGET = { value = "15.0", force = true }

[target.wasm32-unknown-unknown]
rustflags = ["--cfg=getrandom_backend=\"wasm_js\"", "--cfg=web_sys_unstable_apis"]

# macOS / Linux 交叉编译 Windows 平台需要指定Linker和AR
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
